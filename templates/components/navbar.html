<header class="sticky top-0 z-50 border-b border-gray-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4 sm:px-6">
    <a href="{{ url_for('index') }}" class="flex items-center gap-2 font-display text-lg font-bold text-green-900">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo LeafScan AI" class="w-16">
      LeafScan AI
    </a>

    <button id="navbar-toggle"
            class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 text-green-900 md:hidden"
            aria-label="Buka menu" aria-expanded="false" aria-controls="navbar-menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    {% set nav_items = [
    ('index', url_for('index'), 'Deteksi'),
    ('penyakit', url_for('penyakit'), 'Penyakit'),
    ('#', '#', 'Tips'),
    ('#', '#', 'Tentang')
  ] %}

  <nav id="navbar-menu"
      class="absolute inset-x-0 top-16 hidden flex-col border-b border-gray-100 bg-white px-4 pb-4 shadow-lg
              md:static md:flex md:flex-row md:items-center md:gap-10 md:border-none md:bg-transparent md:p-0 md:shadow-none">

    {% for endpoint, href, label in nav_items %}
    {% set is_active = (request.endpoint == endpoint) %}
    <a href="{{ href }}"
      class="group relative block border-t border-gray-100 py-3 font-medium transition-colors md:border-none md:py-1
              {{ 'text-[#2F6844]' if is_active else 'text-gray-600 hover:text-[#2F6844]' }}">
      {{ label }}
      <span class="absolute -bottom-1 left-0 hidden h-0.5 bg-[#2F6844] transition-all duration-300 md:block
                  {{ 'w-full' if is_active else 'w-0 group-hover:w-full' }}"></span>
    </a>
    {% endfor %}

  </nav>
  </div>
</header>
