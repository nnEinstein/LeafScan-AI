<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}LeafScan AI — Deteksi Penyakit Tanaman{% endblock %}</title>
  <meta name="description" content="Unggah foto daun tanaman dan dapatkan deteksi penyakit secara instan dengan LeafScan AI.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

  <link rel="shortcut icon" href="{{ url_for('static', filename='logo.png') }}">
</head>
<body class="bg-white text-gray-800 antialiased">
  <a href="#konten-utama"
     class="sr-only focus:not-sr-only focus:absolute focus:top-0 focus:left-0 focus:z-[100] focus:bg-green-700 focus:text-white focus:px-4 focus:py-2 focus:rounded-br-lg">
    Lompat ke konten utama
  </a>

  {% include 'components/navbar.html' %}

  <main id="konten-utama">
    {% block content %}{% endblock %}
  </main>

  {% include 'components/footer.html' %}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
